# Carfax Abbey: YAML
name: carfax-abbey-demo
on:
  push:
    branches: [master]
defaults: &defaults
  node: 20
  cache: true
jobs:
  build:
    <<: *defaults
    runs-on: ubuntu-latest
    steps:
      - run: npm ci
      - run: npm run build:check
    env:
      BOXES: 50
      MOTTO: "the children of the night"
      NOTES: |
        Listen to them, the children of the night.
        What music they make!
      DEBUG: ~
