<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carfax Abbey &amp; the hunt</title>
    <style>
      body { background: #26151c; color: #cbc4bc; }
      .host:hover { color: var(--accent, #7c0907); }
    </style>
  </head>

  <body>
    <!-- A comment from the chapel at Carfax -->
    <main id="app" class="abbey" data-boxes="50">
      <h1>Listen to them</h1>
      <p>The children of the night. What <em>music</em> they make!</p>
      <img src="carfax.png" alt="The chapel at Carfax" width="320" loading="lazy" />
      <label for="name">Name</label>
      <input id="name" type="text" required placeholder="Harker" />
      <button type="button" class="host" disabled>Enter</button>
      <a href="https://example.com/journal" target="_blank" rel="noopener">Read the journal</a>
    </main>

    <script type="module">
      const boxes = Number(document.querySelector('#app').dataset.boxes);
      document.title = `${boxes} boxes of earth`;
    </script>
  </body>
</html>
